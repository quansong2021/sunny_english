name: sunny-english
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run the deploy script first}
      MYSQL_DATABASE: sunny_english
      MYSQL_USER: sunny
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run the deploy script first}
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u sunny sunny_english -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-4178}:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sunny_english
      DB_USER: sunny
      DB_PASSWORD: ${DB_PASSWORD:?Run the deploy script first}
      APP_USERNAME: ${APP_USERNAME:-sunny}
      APP_PASSWORD: ${APP_PASSWORD:?Run the deploy script first}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
volumes:
  mysql_data:
